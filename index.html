<style>

.cd{inset:0;background:radial-gradient(#10264d,#050a18);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;text-align:center;font-family:Newsreader,Georgia,serif}
.cd b{font-size:20cqw;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}.cd span{font-size:5cqw;opacity:.85;margin-bottom:2cqw}

@keyframes al{50%{background:#a8262b}}
</style></head>

<script>

1 John 4:8|He that loveth not knoweth not God; for God is love.

Hebrews 11:1|Now faith is the substance of things hoped for, the evidence of things not seen.
Revelation 21:4|And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.`.split("\n").map(l=>l.split("|"));
const mk=(t,r,o)=>Object.assign({t:t||"",r:r||"",bg:"Deep",c:"#ffffff",s:1,n:""},o);
function seed(){return{pres:[{id:uid(),title:"Hope Endtime welcome",ts:now(),slides:[mk("Welcome to Hope Endtime","We are glad you are here",{bg:"Dawn"}),mk("Please silence your phones","",{bg:"Deep"})]}],
songs:[{id:uid(),title:"Amazing Grace",author:"John Newton",cat:"Hymn",fav:1,bg:"Dawn",ts:now(),lyrics:"Amazing grace! how sweet the sound,\nThat saved a wretch like me!\nI once was lost, but now am found;\nWas blind, but now I see.\n\n’Twas grace that taught my heart to fear,\nAnd grace my fears relieved;\nHow precious did that grace appear\nThe hour I first believed.\n\nThrough many dangers, toils and snares,\nI have already come;\n’Tis grace hath brought me safe thus far,\nAnd grace will lead me home."},
{id:uid(),title:"Come, Thou Fount",author:"Robert Robinson",cat:"Hymn",fav:0,bg:"Deep",ts:now(),lyrics:"Come, thou Fount of every blessing,\nTune my heart to sing thy grace;\nStreams of mercy, never ceasing,\nCall for songs of loudest praise.\n\nHere I raise mine Ebenezer;\nHither by thy help I’m come;\nAnd I hope, by thy good pleasure,\nSafely to arrive at home."}],
ann:[{id:uid(),title:"Announcements",text:"Welcome to Hope Endtime\nJoin us every Sunday\n\nPrayer meeting\nWednesday at 6:00 PM"}],
favs:[],sch:[],set:{theme:"dark",font:"serif",tr:"fade",church:"Hope Endtime",logo:""},
tk:{on:true,label:"HOPE ENDTIME",msgs:"Welcome to Hope Endtime\nPrayer meeting Wednesday 6:00 PM\nGive online or in person: thank you for your generosity",speed:5,size:1,bg:"#1a4fb0",c:"#ffffff",pos:"bottom"}}}
let D;try{D=JSON.parse(localStorage.getItem("cvs2"))}catch(e){}D=D||seed();
const save=()=>{try{localStorage.setItem("cvs2",JSON.stringify(D))}catch(e){}};
const cd=()=>D.cd||(D.cd={on:0,end:0,label:"Service starts in"}),al=()=>D.al||(D.al={on:0,text:"",until:0});
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1e3)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s%60).padStart(2,"0")};
const cdTxt=()=>mmss(cd().end-now());
const cdHTML=()=>{const c=cd();return c.on?`<div class="cd"><span>${esc(c.label)}</span><b class="cdv">${cdTxt()}</b></div>`:""};
const alHTML=()=>{const a=al();return a.on?`<div class="al">${esc(a.text)}</div>`:""};
let M=[],tab="songs",dq="",SEL=new Set(),PV={sl:[],i:0,t:""},Q=[],qi=-1,qt="",black=0,logo=0,clr=0,t0=0,cp=null,cs=0,OW=null,selK="",selId="";
const FL=[["serif","Serif (Newsreader)","Newsreader,Georgia,serif"],["sans","Sans-serif (Instrument)","'Instrument Sans',system-ui,sans-serif"],...["Playfair Display","Montserrat","Poppins","Lora","Oswald","Bebas Neue","Merriweather","Roboto Slab","Cinzel","Cormorant Garamond","Raleway","Dancing Script","Pacifico","Lobster","Great Vibes","Caveat","Anton","Archivo Black","Abril Fatface"].map(n=>[n,n,`'${n}',${/Dancing|Pacifico|Lobster|Great Vibes|Caveat/.test(n)?"cursive":/Playfair|Lora|Merriweather|Roboto Slab|Cinzel|Cormorant|Abril/.test(n)?"serif":"sans-serif"}`])];
const FONTF=s=>{const k=(s&&s.f)||D.set.font,f=FL.find(x=>x[0]===k)||FL[0];return f[2]};
const fontOpts=(sel,d)=>(d?'<option value="">Default font</option>':"")+FL.map(f=>`<option value="${f[0]}" ${sel===f[0]?"selected":""} style="font-family:${f[2]}">${f[1]}</option>`).join("");
const bibAll=()=>BIB;
const css=a=>a.length>1?`linear-gradient(160deg,${a.join(",")})`:a[0];

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("cvs2",2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("m"))d.createObjectStore("m",{keyPath:"id"});if(!d.objectStoreNames.contains("b"))d.createObjectStore("b",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
let EV=[];

/* drawing */
function draw(el,s,out,hide){
 if(!s){el.innerHTML='<div class="bg" style="background:#000"></div>';return}
 let h=`<div class="bg ${MOT[s.bg]||""}" style="background:${bgCss(s)}"></div>`;
 if(s.mt==="video")h+=`<video class="mv" src="${s.mu}" ${out?"autoplay controls":"muted preload=metadata"}></video>`;
 else if(s.mt==="image")h+=`<img class="mv" src="${s.mu}" alt="">`;
 if((s.t||s.r)&&!hide)h+=`<div class="txt" style="color:${s.c};font-family:${FONTF(s)};font-size:${5.4*s.s}cqw;${txs(s)}">${esc(s.t)}${s.r?`<em>${esc(s.r)}</em>`:""}</div>`;
 el.innerHTML=h;
 if(out&&D.set.tr==="fade"){el.classList.remove("f");void el.offsetWidth;el.classList.add("f")}
}

function tkHTML(){const t=D.tk;if(!t.on||!t.msgs.trim())return"";const txt=t.msgs.split("\n").filter(x=>x.trim()).join("   ✦   ");
 const dur=Math.max(10,txt.length*(12-t.speed)*.07),dl=-((now()/1000)%dur);
